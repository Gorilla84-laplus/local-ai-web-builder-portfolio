<svg viewBox="0 0 1000 550" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <defs>
    <linearGradient id="bgGradient2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f0f0f;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="1000" height="550" fill="url(#bgGradient2)"/>

  <!-- Title -->
  <text x="500" y="35" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">
    GPU Market Share Evolution (2023-2026)
  </text>

  <!-- ==================== PIE CHART 2023 ==================== -->
  <!-- NVIDIA 88% = 316.8° -->
  <g>
    <text x="150" y="80" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">2023</text>

    <!-- NVIDIA slice (88%) -->
    <path d="M 150 130 L 150 80 A 50 50 0 1 1 60.41 180 Z"
      fill="#6FD4D4" stroke="#1a1a1a" stroke-width="1"/>

    <!-- AMD slice (10%) -->
    <path d="M 60.41 180 A 50 50 0 0 1 59.27 203.91 Z"
      fill="#2BA5F7" stroke="#1a1a1a" stroke-width="1"/>

    <!-- Others slice (2%) -->
    <path d="M 59.27 203.91 A 50 50 0 0 1 150 130 Z"
      fill="#666666" stroke="#1a1a1a" stroke-width="1"/>

    <!-- Labels on pie -->
    <text x="130" y="145" font-size="14" font-weight="bold" fill="#000" text-anchor="middle">88%</text>
    <text x="50" y="190" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">10%</text>
    <text x="140" y="220" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">2%</text>

    <!-- Legend below -->
    <rect x="90" y="250" width="120" height="70" fill="#1a1a1a" stroke="#666" stroke-width="1" rx="3"/>
    <circle cx="105" cy="265" r="5" fill="#6FD4D4"/>
    <text x="120" y="270" font-size="11" fill="#ffffff">NVIDIA</text>
    <circle cx="105" cy="285" r="5" fill="#2BA5F7"/>
    <text x="120" y="290" font-size="11" fill="#ffffff">AMD</text>
    <circle cx="105" cy="305" r="5" fill="#666666"/>
    <text x="120" y="310" font-size="11" fill="#ffffff">Others</text>
  </g>

  <!-- ==================== PIE CHART 2024 ==================== -->
  <!-- NVIDIA 85% = 306°, AMD 13% = 46.8°, Others 2% = 7.2° -->
  <g>
    <text x="500" y="80" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">2024</text>

    <!-- NVIDIA slice (85%) -->
    <path d="M 500 130 L 500 80 A 50 50 0 1 1 44.10 189.55 Z"
      fill="#6FD4D4" stroke="#1a1a1a" stroke-width="1"/>

    <!-- AMD slice (13%) -->
    <path d="M 44.10 189.55 A 50 50 0 0 1 39.75 211.86 Z"
      fill="#2BA5F7" stroke="#1a1a1a" stroke-width="1"/>

    <!-- Others slice (2%) -->
    <path d="M 39.75 211.86 A 50 50 0 0 1 500 130 Z"
      fill="#666666" stroke="#1a1a1a" stroke-width="1"/>

    <!-- Labels on pie -->
    <text x="480" y="145" font-size="14" font-weight="bold" fill="#000" text-anchor="middle">85%</text>
    <text x="35" y="200" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">13%</text>
    <text x="475" y="225" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">2%</text>

    <!-- Legend below -->
    <rect x="440" y="250" width="120" height="70" fill="#1a1a1a" stroke="#666" stroke-width="1" rx="3"/>
    <circle cx="455" cy="265" r="5" fill="#6FD4D4"/>
    <text x="470" y="270" font-size="11" fill="#ffffff">NVIDIA</text>
    <circle cx="455" cy="285" r="5" fill="#2BA5F7"/>
    <text x="470" y="290" font-size="11" fill="#ffffff">AMD</text>
    <circle cx="455" cy="305" r="5" fill="#666666"/>
    <text x="470" y="310" font-size="11" fill="#ffffff">Others</text>
  </g>

  <!-- ==================== PIE CHART 2026 ==================== -->
  <!-- NVIDIA 78% = 280.8°, AMD 18% = 64.8°, Others 4% = 14.4° -->
  <g>
    <text x="850" y="80" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">2026 (Forecast)</text>

    <!-- NVIDIA slice (78%) -->
    <path d="M 850 130 L 850 80 A 50 50 0 1 1 54.76 180.76 Z"
      fill="#6FD4D4" stroke="#1a1a1a" stroke-width="1"/>

    <!-- AMD slice (18%) -->
    <path d="M 54.76 180.76 A 50 50 0 0 1 35.36 223.20 Z"
      fill="#2BA5F7" stroke="#1a1a1a" stroke-width="1"/>

    <!-- Others slice (4%) -->
    <path d="M 35.36 223.20 A 50 50 0 0 1 850 130 Z"
      fill="#666666" stroke="#1a1a1a" stroke-width="1"/>

    <!-- Labels on pie -->
    <text x="830" y="145" font-size="14" font-weight="bold" fill="#000" text-anchor="middle">78%</text>
    <text x="35" y="200" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">18%</text>
    <text x="825" y="235" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">4%</text>

    <!-- Legend below -->
    <rect x="790" y="250" width="120" height="70" fill="#1a1a1a" stroke="#666" stroke-width="1" rx="3"/>
    <circle cx="805" cy="265" r="5" fill="#6FD4D4"/>
    <text x="820" y="270" font-size="11" fill="#ffffff">NVIDIA</text>
    <circle cx="805" cy="285" r="5" fill="#2BA5F7"/>
    <text x="820" y="290" font-size="11" fill="#ffffff">AMD</text>
    <circle cx="805" cy="305" r="5" fill="#666666"/>
    <text x="820" y="310" font-size="11" fill="#ffffff">Others</text>
  </g>

  <!-- Trend indicators -->
  <g>
    <text x="500" y="380" font-size="13" fill="#aaa" text-anchor="middle">
      📊 Market Concentration Shifts
    </text>

    <rect x="150" y="400" width="200" height="110" fill="#1a1a1a" stroke="#6FD4D4" stroke-width="1" rx="4" opacity="0.8"/>
    <text x="250" y="420" font-size="12" font-weight="bold" fill="#6FD4D4" text-anchor="middle">NVIDIA</text>
    <text x="160" y="442" font-size="11" fill="#ddd">2023: 88%</text>
    <text x="160" y="459" font-size="11" fill="#ddd">2026: 78%</text>
    <text x="160" y="476" font-size="11" fill="#ff6b6b">↓ -10 points</text>
    <text x="160" y="503" font-size="9" fill="#aaa" font-style="italic">(still dominant)</text>

    <rect x="400" y="400" width="200" height="110" fill="#1a1a1a" stroke="#2BA5F7" stroke-width="1" rx="4" opacity="0.8"/>
    <text x="500" y="420" font-size="12" font-weight="bold" fill="#2BA5F7" text-anchor="middle">AMD</text>
    <text x="410" y="442" font-size="11" fill="#ddd">2023: 10%</text>
    <text x="410" y="459" font-size="11" fill="#ddd">2026: 18%</text>
    <text x="410" y="476" font-size="11" fill="#6bff6b">↑ +8 points</text>
    <text x="410" y="503" font-size="9" fill="#aaa" font-style="italic">(gaining share)</text>

    <rect x="650" y="400" width="200" height="110" fill="#1a1a1a" stroke="#999" stroke-width="1" rx="4" opacity="0.8"/>
    <text x="750" y="420" font-size="12" font-weight="bold" fill="#999" text-anchor="middle">Others</text>
    <text x="660" y="442" font-size="11" fill="#ddd">2023: 2%</text>
    <text x="660" y="459" font-size="11" fill="#ddd">2026: 4%</text>
    <text x="660" y="476" font-size="11" fill="#ffb66b">↑ +2 points</text>
    <text x="660" y="503" font-size="9" fill="#aaa" font-style="italic">(niche players)</text>
  </g>

</svg>